<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                Employee Management System
            </a>

            <div>
                <a href="/" class="btn btn-outline-light btn-sm me-2">
                    Dashboard
                </a>

                <a href="/employees" class="btn btn-outline-light btn-sm me-2">
                    Employees
                </a>

                <a href="/add-employee" class="btn btn-success btn-sm">
                    + Add Employee
                </a>
            </div>

        </div>
    </nav>


    <!-- Dashboard -->
    <div class="container mt-5">

        <h1 class="mb-4">Dashboard</h1>

        <div class="row g-4">

            <!-- Total Employees -->
            <div class="col-md-4">

                <div class="card text-center shadow-sm h-100">

                    <div class="card-body">

                        <h5 class="card-title">
                            Total Employees
                        </h5>

                        <h2 class="display-5 fw-bold text-primary">
                            {{ employee_count }}
                        </h2>

                        <a href="/employees"
                           class="btn btn-primary">
                            View Employees
                        </a>

                    </div>

                </div>

            </div>


            <!-- Add Employee -->
            <div class="col-md-4">

                <div class="card text-center shadow-sm h-100">

                    <div class="card-body">

                        <h5 class="card-title">
                            Manage Employees
                        </h5>

                        <p class="text-muted">
                            Add a new employee to the system.
                        </p>

                        <a href="/add-employee"
                           class="btn btn-success">
                            + Add Employee
                        </a>

                    </div>

                </div>

            </div>


            <!-- Database -->
            <div class="col-md-4">

                <div class="card text-center shadow-sm h-100">

                    <div class="card-body">

                        <h5 class="card-title">
                            Database
                        </h5>

                        <span class="badge bg-success fs-6">
                            Connected
                        </span>

                        <p class="text-muted mt-3 mb-0">
                            Oracle Database
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <footer class="text-center text-muted mt-5">
        <p>
            Employee Management System &copy; 2026
        </p>
    </footer>

</body>

</html>
