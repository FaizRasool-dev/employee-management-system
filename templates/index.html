<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                Employee Management System
            </a>

            <div>
                <a href="/" class="btn btn-outline-light btn-sm me-2">
                    Dashboard
                </a>

                <a href="/employees" class="btn btn-outline-light btn-sm me-2">
                    Employees
                </a>

                <a href="/add-employee" class="btn btn-success btn-sm">
                    + Add Employee
                </a>
            </div>

        </div>
    </nav>


    <!-- Dashboard -->
    <div class="container mt-5">

        <h1 class="mb-4">Dashboard</h1>

        <div class="row g-4">

            <!-- Total Employees -->
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Total Employees</h5>
                         <h2>{{ total_employees }}</h2>
                    </div>
                </div>
            </div>



            <!-- Total Departments -->
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Total Departments</h5>
                        <h2>{{ total_departments }}</h2>
                    </div>
                </div>
            </div>


            <!-- Average Salary -->
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Average Salary</h5>
                        <h2>{{ "%.2f"|format(average_salary) }}</h2>
                    </div>
                </div>
            </div>

        </div>

    </div>


    <footer class="text-center text-muted mt-5">
        <p>
            Employee Management System &copy; 2026
        </p>
    </footer>

</body>

</html>
